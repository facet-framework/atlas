schema_version: '0.1'
id: workspace/hosting/registry-reader
lifecycle: active
intent:
  summary: Read a repository's FACET registry in the browser.
contract:
  scenarios:
    - id: registry-reader
      statement: |
        Given a repository registry with a feature and its anchor
        When the serving Atlas reader requests the corpus
        Then the terminal corpus event includes the feature and its anchor
verification:
  unit_tests:
    - id: backend/server/server_test.go::TestStreamEndsWithTheWholeCorpus
      proves:
        - registry-reader
lineage:
  owner:
    team: atlas
  created_at: '2026-11-20'
knowledge:
  discoverability:
    question: Where can I open the reader?
    answer: Run `facet ui` in the repository you want to read and open the local address it prints.


