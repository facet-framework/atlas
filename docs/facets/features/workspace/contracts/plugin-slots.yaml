schema_version: '0.1'
id: workspace/contracts/plugin-slots
lifecycle: active
intent:
  summary: Render plugin contributions in designated reader slots.
contract:
  scenarios:
    - id: plugin-slots
      statement: |
        Given an active plugin contributes a component to a supported slot
        When Atlas renders that slot
        Then the plugin component appears there
    - id: show-contextual-panels
      statement: |
        Given a plugin contributes panels for the overview, record and scenario slots
        When the reader opens each place
        Then the relevant contribution renders at that place
lineage:
  owner:
    team: atlas
  created_at: '2026-11-20'
verification:
  unit_tests:
    - id: frontend/src/reader/plugin-host.spec.tsx::draws the panels on the overview, the record
        and the scenario, and nowhere else
      proves:
        - show-contextual-panels


