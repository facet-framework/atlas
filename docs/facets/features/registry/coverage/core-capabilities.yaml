schema_version: '0.1'
id: registry/coverage/core-capabilities
lifecycle: active
intent:
  summary: See which capabilities other parts of the product depend on.
contract:
  scenarios:
    - id: rank-by-incoming-dependencies
      statement: |
        Given the registry contains dependencies between capabilities
        When the reader opens the dependency section
        Then it ranks capabilities by incoming dependencies and shows their counts
    - id: show-unmeasured-dependencies
      statement: |
        Given no record declares a dependency between capabilities
        When the reader opens the dependency section
        Then the section reports that it has no measurement
    - id: show-a-distributed-graph
      statement: |
        Given the recorded dependencies are distributed below the threshold for core capabilities
        When the reader opens the newcomer overview's dependency section
        Then the section shows the leading capabilities and their incoming dependency shares
lineage:
  owner:
    team: atlas
  created_at: '2026-11-20'
verification:
  unit_tests:
    - id: frontend/src/reader/overview-newcomer.spec.tsx::draws the capabilities a spread-out graph
        leans on, and says it leans
      proves:
        - show-a-distributed-graph


