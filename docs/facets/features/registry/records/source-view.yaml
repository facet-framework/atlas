schema_version: '0.1'
id: registry/records/source-view
lifecycle: active
intent:
  summary: Read anchored repository files and see the lines that link them to records.
contract:
  scenarios:
    - id: source-view
      statement: |
        Given an anchored source file inside the repository
        When the reader requests the file
        Then the host returns the text and the scanned anchor lines
verification:
  unit_tests:
    - id: backend/server/source_test.go::TestSourceAnswersAnAnchoredFileWithTheAnchorLinesTheHostScanned
      proves:
        - source-view
lineage:
  owner:
    team: atlas
  created_at: '2026-11-20'
knowledge:
  discoverability:
    question: Which files can I open?
    answer: The source viewer accepts repository-relative paths to anchored files inside the repository.


