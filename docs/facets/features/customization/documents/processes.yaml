schema_version: '0.1'
id: customization/documents/processes
lifecycle: active
intent:
  summary: Browse BPMN files and inspect an individual process.
contract:
  scenarios:
    - id: processes
      statement: |
        Given a process gallery with a readable BPMN file
        When the reader opens the file
        Then the process workspace shows its diagram and elements
    - id: show-an-empty-directory
      statement: |
        Given the configured process directory has no BPMN files
        When the reader opens the gallery
        Then the gallery reports that the directory has no BPMN files
lineage:
  owner:
    team: atlas
  created_at: '2026-11-20'
knowledge:
  discoverability:
    question: Where does Atlas look for process files?
    answer: The BPMN plugin uses `docs/bpmn` by default. Set `bpmn.directory` in `.facetrc.yaml` to
      use another repository directory.
verification:
  unit_tests:
    - id: frontend/src/reader/processes.spec.tsx::says why when there is no .bpmn file
      proves:
        - show-an-empty-directory


