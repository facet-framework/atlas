schema_version: '0.1'
id: customization/contributions/plugin-commands
lifecycle: active
intent:
  summary: Find and invoke registered plugin commands.
contract:
  scenarios:
    - id: plugin-commands
      statement: |
        Given an active plugin registers a command
        When the reader searches for it
        Then the matching command is offered
    - id: run-a-slash-command
      statement: |
        Given the Companion composer has a registered plugin command
        When the reader submits the command with an argument
        Then the plugin receives the argument
lineage:
  owner:
    team: atlas
  created_at: '2026-11-20'
verification:
  unit_tests:
    - id: frontend/src/reader/plugin-host.spec.tsx::lists a plugin's command in the chat's slash
        list and runs it with an argument
      proves:
        - run-a-slash-command


