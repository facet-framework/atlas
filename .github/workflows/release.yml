name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  GOPROXY: https://proxy.golang.org
  GOWORK: off
  GOFLAGS: -mod=readonly -p=2
  GOTOOLCHAIN: local
jobs:
  plan:
    if: github.repository == 'facet-framework/atlas' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the approved release pull request
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -er '.version | strings' frontend/package.json)
          sh scripts/release-pr-check.sh "$version" "$GITHUB_REPOSITORY"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check release protections before any deployment
        env:
          GH_TOKEN: ${{ secrets.RELEASE_SETTINGS_TOKEN }}
        run: sh scripts/release-environment-check.sh
      - name: Wait for CI on the squash commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          endpoint="repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&branch=main&event=push&per_page=1"
          for attempt in {1..120}; do
            conclusion=$(gh api --method GET "$endpoint" --jq '.workflow_runs[0].conclusion // ""')
            case "$conclusion" in
              success) echo "CI succeeded on $GITHUB_SHA"; exit 0 ;;
              '') sleep 20 ;;
              *) echo "::error::CI on $GITHUB_SHA concluded $conclusion"; exit 1 ;;
            esac
          done
          echo "::error::Timed out waiting for CI on $GITHUB_SHA"
          exit 1

  browser:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26.8"
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm install --global pnpm@10.33.0
      - run: sh scripts/build.sh reader
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reader
          path: |
            backend/server/assets/index.html
            backend/server/assets/atlas.js
            backend/server/assets/atlas.css
            backend/server/assets/theme-init.js
          if-no-files-found: error
          retention-days: 7
  native:
    needs: [plan, browser]
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, platform: linux_amd64 }
          - { os: ubuntu-24.04-arm, platform: linux_arm64 }
          - { os: macos-15-intel, platform: darwin_amd64 }
          - { os: macos-15, platform: darwin_arm64 }
          - { os: windows-2025, platform: windows_amd64 }
          - { os: windows-11-arm, platform: windows_arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26.8"
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reader
          path: backend/server/assets
      - name: Package native composition and smoke check extracted archive
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          sh scripts/release-package.sh "$VERSION" "$PLATFORM" dist/release
          sh scripts/release-smoke.sh dist/release "$PLATFORM"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.platform }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 7
  collect:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist/platforms
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26.8"
          cache: false
      - run: sh scripts/release-collect.sh dist/platforms dist/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: dist/release/
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: [plan, collect]
    if: github.event_name == 'push'
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist/release
      - run: cd dist/release && sha256sum --check --strict checksums.txt
      - name: Recheck release protections
        env:
          GH_TOKEN: ${{ secrets.RELEASE_SETTINGS_TOKEN }}
        run: sh scripts/release-environment-check.sh
      - name: Tag the approved squash commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/release-tag.sh "$VERSION" "$GITHUB_REPOSITORY"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/release/checksums.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/release-publish.sh "$VERSION" "$GITHUB_REPOSITORY" dist/release
